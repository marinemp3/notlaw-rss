name: Generate RSS Feed

on:
  # 手動実行
  workflow_dispatch:
  # 毎週金曜日 14:30 (中国時間 = UTC+8)
  # UTC時間では 6:30 (14:30 - 8:00)
  schedule:
    - cron: '30 6 * * 5'

# 権限の設定（重要！）
permissions:
  contents: write  # リポジトリの内容を書き込む権限
  actions: write   # keepalive アクションが GitHub API を利用するために必要

jobs:
  generate:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # プッシュに必要な設定
          fetch-depth: 0
          
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Generate RSS
        run: python generate_rss.py
        
      - name: Commit and push if changed
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add rss.xml
          git diff --staged --quiet || git commit -m "Update RSS feed [skip ci]"
          # プッシュ前にリモートの変更を取り込む（競合回避）
          git pull --rebase origin ${{ github.ref_name }}
          git push
        env:
          # GITHUB_TOKENは自動的に設定されます
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      # 60日間の無効化対策（keepalive）
      - name: Keepalive（ワークフロー無効化防止）
        if: always()
        uses: entepotenz/keep-github-actions-alive-min-dependencies@v1
        with:
          COMMIT_MESSAGE: "Keepalive: ワークフロー無効化防止"
          TIME_ELAPSED_THRESHOLD_IN_DAYS: 50
